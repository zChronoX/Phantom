# Codemagic: build iOS su Mac M2 in cloud (500 minuti gratuiti al mese per account personali).
# Produce un .ipa NON firmato da installare con Sideloadly e un Apple ID gratuito (vedi ADR-003).
# Android, core e sonda si compilano invece su GitHub Actions, gratis su Linux.
workflows:
  ios-f0:
    name: iOS · Phantom F0 (non firmata)
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - "ios/"
          - "codemagic.yaml"
    scripts:
      - name: Test del parser scrcpy
        script: ./ios/Tests/run-tests.sh
      - name: Compila e crea l'IPA
        script: ./ios/build-ipa.sh
      - name: Prepara gli artifacts
        script: |
          # Tutto ciò che sta in CM_EXPORT_DIR viene pubblicato come artifact da Codemagic.
          EXPORT_DIR="${CM_EXPORT_DIR:-$CM_BUILD_DIR/export}"
          mkdir -p "$EXPORT_DIR"
          echo "File prodotti:"
          find ios/build -maxdepth 2 \( -name '*.ipa' -o -name '*.log' \) -exec ls -l {} \;
          cp ios/build/*.ipa ios/build/xcodebuild.log "$EXPORT_DIR"/
          ls -l "$EXPORT_DIR"
    artifacts:
      - ios/build/*.ipa
      - ios/build/xcodebuild.log
