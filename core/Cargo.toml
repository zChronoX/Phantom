[workspace]
resolver = "2"
members = [
    "crates/phantom-proto",
    "crates/phantom-netsim",
    "crates/phantom-clock",
    "crates/phantom-video",
    "crates/phantom-core",
    "crates/phantom-quic",
    "crates/phantom-p2p",
    "crates/phantom-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Non usare `panic = "abort"`: UniFFI e il fallback DNS di `iroh` su Android usano `catch_unwind`.
