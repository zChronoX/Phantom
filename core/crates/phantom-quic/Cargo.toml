[package]
name = "phantom-quic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Phantom: trasporto QUIC con datagrammi"

[lints]
workspace = true

[dependencies]
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# Solo per il tipo `RttEstimator` del controllo di congestione personalizzato: stessa versione di `quinn`.
quinn-proto = { version = "0.11", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }

[dev-dependencies]
phantom-core = { path = "../phantom-core" }
