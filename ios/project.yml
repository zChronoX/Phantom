# Progetto Xcode generato con XcodeGen (`xcodegen generate`), così non si modifica mai
# un .xcodeproj a mano e la build in cloud (Codemagic) è riproducibile. Vedi ADR-003.
name: PhantomF0
options:
  bundleIdPrefix: app.phantom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PhantomF0:
    type: application
    platform: iOS
    sources:
      - path: PhantomF0
        excludes:
          - Info.plist
      # Binding Swift del core Rust (UniFFI): li genera build-ipa.sh prima di XcodeGen, in build/rust.
      - path: build/rust/swift/phantom_ffi.swift
    scheme: {}
    info:
      path: PhantomF0/Info.plist
      properties:
        CFBundleDisplayName: Phantom F0
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # Senza questa voce iOS limita a 60 Hz gli aggiornamenti dello schermo delle app: serve per i 120 fps di ProMotion.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Senza questa voce iOS blocca le connessioni verso la rete di casa.
        NSLocalNetworkUsageDescription: Phantom si collega al tuo telefono Android sulla rete di casa per lo streaming e la scoperta automatica.
        NSCameraUsageDescription: Phantom usa la fotocamera per scansionare il codice QR di accoppiamento del tuo telefono Android.
        NSBonjourServices:
          - _phantom._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.phantom.f0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Core Rust: libreria statica per iPhone e modulo C dei binding (vedi core/crates/phantom-ffi e ADR-008).
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/build/rust/swift"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/build/rust/swift/phantom_ffiFFI.modulemap"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/build/rust/lib"
        OTHER_LDFLAGS: "-lphantom_ffi -liconv -lresolv -framework SystemConfiguration -framework Security -framework Network"
