# App host Android Kotlin (APK leggera arm64-v8a + x86_64 con binding UniFFI dal core Rust).
name: Android · Phantom APK

on:
  push:
    branches: [main]
    paths: ["android/app/**", "core/**", ".github/workflows/android-app.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/app/**", "core/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Su un tag la versione deve coincidere con Android, iOS e CHANGELOG.md: meglio fallire subito che pubblicare
      # una release con il numero sbagliato.
      - name: Controllo versione del tag
        if: github.ref_type == 'tag'
        run: bash tools/release/check-version.sh "${GITHUB_REF_NAME}"

      - name: Toolchain Rust e bersagli Android (arm64 + x86_64)
        run: |
          rustup show
          rustup target add aarch64-linux-android x86_64-linux-android
        working-directory: core

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android-host-apk

      - name: Genera binding Kotlin e libphantom_ffi.so (arm64-v8a + x86_64)
        working-directory: core
        run: |
          cargo build -p phantom-ffi --release
          cargo run -q -p uniffi-bindgen --release -- generate \
            --library target/release/libphantom_ffi.so \
            --language kotlin --no-format \
            --out-dir ../android/app/app/src/main/java

          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK_BIN/llvm-ranlib"
          cargo rustc -p phantom-ffi --release --target aarch64-linux-android --crate-type cdylib

          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          export RANLIB_x86_64_linux_android="$NDK_BIN/llvm-ranlib"
          cargo rustc -p phantom-ffi --release --target x86_64-linux-android --crate-type cdylib

          mkdir -p ../android/app/app/src/main/jniLibs/arm64-v8a ../android/app/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libphantom_ffi.so ../android/app/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libphantom_ffi.so ../android/app/app/src/main/jniLibs/x86_64/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accetta licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      # Keystore stabile (secret PHANTOM_KEYSTORE_BASE64 + password/alias): gli aggiornamenti si installano sopra
      # senza disinstallare. Senza secret si firma con la chiave di debug della run (va disinstallata la versione
      # precedente), ma l'APK resta una release non debuggable, molto più veloce della build debug.
      - name: Prepara keystore di firma (se configurato)
        env:
          PHANTOM_KEYSTORE_BASE64: ${{ secrets.PHANTOM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PHANTOM_KEYSTORE_BASE64" ]; then
            echo "$PHANTOM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/phantom-release.jks"
            echo "PHANTOM_KEYSTORE_PATH=$RUNNER_TEMP/phantom-release.jks" >> "$GITHUB_ENV"
            echo "Keystore di release configurato"
          else
            echo "::warning::Secret PHANTOM_KEYSTORE_BASE64 assente: APK firmato con chiave di debug della run"
          fi

      - name: Test unitari JVM e build Phantom.apk (release)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          PHANTOM_KEYSTORE_PASSWORD: ${{ secrets.PHANTOM_KEYSTORE_PASSWORD }}
          PHANTOM_KEY_ALIAS: ${{ secrets.PHANTOM_KEY_ALIAS }}
          PHANTOM_KEY_PASSWORD: ${{ secrets.PHANTOM_KEY_PASSWORD }}
        run: |
          gradle -p android/app testDebugUnitTest assembleRelease --no-daemon
          mkdir -p dist
          cp android/app/app/build/outputs/apk/release/app-release.apk dist/Phantom.apk
          ls -lh dist/Phantom.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phantom-apk
          path: dist/Phantom.apk

      - name: Pubblica release ufficiale (tag v*)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          bash tools/release/changelog-section.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "---"
            echo "**Download:** \`Phantom.apk\` (Android, arm64-v8a + x86_64) e \`Phantom.ipa\` (iPhone, da firmare con Sideloadly)."
          } >> "$RUNNER_TEMP/notes.md"
          # Le due pipeline (Android e iOS) arrivano qui in parallelo: chi arriva prima crea la release, l'altra carica
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Phantom $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            || true
          gh release upload "$TAG" dist/Phantom.apk --clobber

      - name: Pubblica build continua su «f0-latest»
        if: github.event_name != 'pull_request' && github.ref_type != 'tag' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view f0-latest >/dev/null 2>&1 || gh release create f0-latest --prerelease \
            --title "Phantom · ultime build di sviluppo" \
            --notes "Build automatiche generate da main: Phantom.ipa (iPhone) e Phantom.apk (Android)." \
            || true
          gh release upload f0-latest dist/Phantom.apk --clobber
