# Build iOS su macOS (gratuita per i repository pubblici): serve a trovare subito gli
# errori di compilazione. L'IPA si scarica dalla pagina dell'esecuzione, sezione Artifacts.
name: iOS · Phantom F0

on:
  push:
    branches: [main]
    paths: ["ios/**", "core/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # l'app contiene il core Rust (build-ipa.sh lo compila): la cache evita di rifarlo da zero a ogni build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ios-app
      - name: Test del parser scrcpy
        run: ./ios/Tests/run-tests.sh

      - name: Compila e crea l'IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhantomF0-ipa
          path: |
            ios/build/*.ipa
            ios/build/xcodebuild.log

      - name: Pubblica nella release «f0-latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view f0-latest >/dev/null 2>&1 || gh release create f0-latest --prerelease \
            --title "Phantom F0 · ultime build" \
            --notes "File sempre aggiornati dalle compilazioni automatiche: phantom-f0.zip (modulo per il POCO, da installare nel manager SukiSU) e PhantomF0.ipa (app per iPhone)." \
            || true
          gh release upload f0-latest ios/build/PhantomF0.ipa --clobber
