# Build iOS su macOS: compila il core Rust + app SwiftUI e pubblica `Phantom.ipa`
# nelle release taggate (`v*`) e nelle build di sviluppo su `main`.
name: iOS · Phantom

on:
  push:
    branches: [main]
    paths: ["ios/**", "core/**", ".github/workflows/ios.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Su un tag la versione deve coincidere con Android, iOS e CHANGELOG.md: meglio fallire subito che pubblicare
      # una release con il numero sbagliato.
      - name: Controllo versione del tag
        if: github.ref_type == 'tag'
        run: bash tools/release/check-version.sh "${GITHUB_REF_NAME}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ios-app
      - name: Test Swift (parser, sessione, pairing e input)
        run: ./ios/Tests/run-tests.sh

      - name: Compila e crea Phantom.ipa
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./ios/build-ipa.sh
          cp ios/build/PhantomF0.ipa ios/build/Phantom.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phantom-ipa
          path: |
            ios/build/Phantom.ipa
            ios/build/xcodebuild.log

      - name: Pubblica release ufficiale (tag v*)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          bash tools/release/changelog-section.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "---"
            echo "**Download:** \`Phantom.apk\` (Android, arm64-v8a + x86_64) e \`Phantom.ipa\` (iPhone, da firmare con Sideloadly)."
          } >> "$RUNNER_TEMP/notes.md"
          # Le due pipeline (Android e iOS) arrivano qui in parallelo: chi arriva prima crea la release, l'altra carica
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Phantom $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            || true
          gh release upload "$TAG" ios/build/Phantom.ipa --clobber

      - name: Pubblica build continua su «f0-latest»
        if: github.ref_type != 'tag' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view f0-latest >/dev/null 2>&1 || gh release create f0-latest --prerelease \
            --title "Phantom · ultime build di sviluppo" \
            --notes "Build automatiche generate da main: Phantom.ipa (iPhone) e Phantom.apk (Android)." \
            || true
          gh release upload f0-latest ios/build/Phantom.ipa --clobber
