# Nucleo Rust (protocollo, simulatore di rete, sincronia degli orologi, video, controllo del bitrate).
# Gira su Linux, macOS e Windows: è la stessa logica che andrà sull'iPhone e sul POCO, e deve comportarsi allo
# stesso modo ovunque. Controlla anche che compili per Android e iOS.
name: Core · Rust

on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: core

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: Formato, clippy, documentazione
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da core/rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Documentazione senza avvisi
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  test:
    name: Prove · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da core/rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # in release: le prove sul simulatore girano in millisecondi, quelle su UDP reale durano qualche secondo
      - name: Prove (release)
        run: cargo test --workspace --release -- --nocapture --test-threads=2
      - name: Prove (debug, solo Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace

  cross:
    name: Compila per ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: macos-15, target: aarch64-apple-ios }
          - { os: macos-15, target: aarch64-apple-ios-sim }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain e bersaglio
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.target }}
      # solo le librerie: `check` non collega, quindi non serve l'NDK né Xcode per i test
      - run: cargo check --workspace --lib --release --target ${{ matrix.target }}

  msrv:
    name: Versione minima di Rust (1.82)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.82
        run: rustup toolchain install 1.82 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: msrv
      # il binding UniFFI richiede un compilatore più recente: l'MSRV riguarda il nucleo che gira dappertutto
      - run: cargo +1.82 check --workspace --lib --exclude phantom-ffi --exclude uniffi-bindgen

  # I binding: il core Rust visto da Swift (app iPhone) e da Kotlin (server Android).
  # Il test Swift compila i binding generati insieme a un programma che pilota host e client in memoria.
  ffi-apple:
    name: Binding Swift (macOS) · prova e libreria iOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain e bersagli iOS
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ffi-apple
      - name: Libreria per macOS e binding Swift
        run: |
          cargo build -p phantom-ffi --release
          mkdir -p ../dist/swift
          cargo run -q -p uniffi-bindgen --release -- generate --library target/release/libphantom_ffi.dylib --language swift --out-dir ../dist/swift
          ls -l ../dist/swift
      - name: Prova in Swift (host e client in memoria)
        run: |
          mkdir -p ../dist/swift-smoke
          swiftc -O -module-name PhantomSmoke \
            -Xcc -fmodule-map-file=../dist/swift/phantom_ffiFFI.modulemap -I ../dist/swift \
            -L target/release -lphantom_ffi \
            ../dist/swift/phantom_ffi.swift crates/phantom-ffi/swift-smoke/main.swift \
            -o ../dist/swift-smoke/smoke
          DYLD_LIBRARY_PATH=target/release ../dist/swift-smoke/smoke
      - name: Librerie statiche per iPhone e simulatore
        run: |
          cargo rustc -p phantom-ffi --release --target aarch64-apple-ios --crate-type staticlib
          cargo rustc -p phantom-ffi --release --target aarch64-apple-ios-sim --crate-type staticlib
          mkdir -p ../dist/ios
          cp target/aarch64-apple-ios/release/libphantom_ffi.a ../dist/ios/libphantom_ffi-ios.a
          cp target/aarch64-apple-ios-sim/release/libphantom_ffi.a ../dist/ios/libphantom_ffi-ios-sim.a
          ls -l ../dist/ios
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-ffi-apple
          path: |
            dist/swift/
            dist/ios/
          retention-days: 14

  ffi-android:
    name: Binding Kotlin e libreria Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain e bersaglio Android
        run: |
          rustup show
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ffi-android
      - name: Binding Kotlin (da una libreria per Linux)
        run: |
          cargo build -p phantom-ffi --release
          mkdir -p ../dist/kotlin
          cargo run -q -p uniffi-bindgen --release -- generate --library target/release/libphantom_ffi.so --language kotlin --no-format --out-dir ../dist/kotlin
          test -s ../dist/kotlin/uniffi/phantom_ffi/phantom_ffi.kt
          grep -q "class PhantomHost" ../dist/kotlin/uniffi/phantom_ffi/phantom_ffi.kt
          grep -q "class PhantomClient" ../dist/kotlin/uniffi/phantom_ffi/phantom_ffi.kt
      - name: Libreria per Android (arm64, NDK del runner)
        run: |
          # ANDROID_NDK_LATEST_HOME è una variabile del runner, non del workflow: va letta nella shell
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          cargo rustc -p phantom-ffi --release --target aarch64-linux-android --crate-type cdylib
          mkdir -p ../dist/android/arm64-v8a
          cp target/aarch64-linux-android/release/libphantom_ffi.so ../dist/android/arm64-v8a/
          ls -l ../dist/android/arm64-v8a
          file ../dist/android/arm64-v8a/libphantom_ffi.so
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-ffi-android
          path: |
            dist/kotlin/
            dist/android/
          retention-days: 14
