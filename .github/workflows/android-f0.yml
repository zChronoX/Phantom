# Sonda e modulo della fase 0: compilati su Linux (gratuito) a ogni modifica.
# Il pacchetto phantom-f0.zip si scarica dalla pagina dell'esecuzione, sezione Artifacts.
name: Android · Phantom F0

on:
  push:
    branches: [main]
    paths: ["android/**", "tools/**", ".github/workflows/android-f0.yml"]
  pull_request:
    paths: ["android/**", "tools/**"]
  workflow_dispatch:

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti (zig, shellcheck)
        run: pip install --quiet ziglang shellcheck-py

      - name: Controllo degli script
        run: |
          cd android/module
          shellcheck -s sh -e SC1090,SC1091 bin/phantomctl bin/phantom-postmortem.sh bin/phantom-report.sh service.sh action.sh uninstall.sh customize.sh

      - name: Scarica il server di scrcpy (Apache 2.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch_scrcpy.sh

      - name: Compila sonda e modulo
        run: android/module/build.sh

      - name: Controllo del pacchetto finale
        run: android/module/tests/test_package.sh

      - name: Prova del ponte scrcpy (build statica)
        run: python3 android/probe/tests/test_scrcpy_relay.py android/probe/build/phantom-probe-x86_64

      - name: Prova del ponte con i rilevatori di errori di memoria
        run: |
          cd android/probe
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Wno-unused-parameter \
            -o build/phantom-probe-asan phantom-probe.c
          ASAN_OPTIONS=detect_leaks=0 python3 tests/test_scrcpy_relay.py build/phantom-probe-asan

      - name: Prova degli script del modulo
        run: android/module/tests/test_module.sh

      - name: Prova della sonda (x86_64)
        run: |
          P=android/probe/build/phantom-probe-x86_64
          printf '#!/bin/sh\necho test\n' > /tmp/getprop && chmod +x /tmp/getprop
          $P --log /tmp/probe.log --pidfile /tmp/probe.pid --daemon --getprop /tmp/getprop
          sleep 0.5
          python3 tools/f0_client.py status 127.0.0.1
          python3 tools/f0_client.py ping 127.0.0.1 --seconds 2 --interval 5
          kill "$(cat /tmp/probe.pid)"

      - uses: actions/upload-artifact@v4
        with:
          name: phantom-f0
          path: dist/phantom-f0.zip

      - name: Pubblica nella release «f0-latest»
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view f0-latest >/dev/null 2>&1 || gh release create f0-latest --prerelease \
            --title "Phantom F0 · ultime build" \
            --notes "File sempre aggiornati dalle compilazioni automatiche: phantom-f0.zip (modulo per il POCO, da installare nel manager SukiSU) e PhantomF0.ipa (app per iPhone)." \
            || true
          gh release upload f0-latest dist/phantom-f0.zip --clobber
