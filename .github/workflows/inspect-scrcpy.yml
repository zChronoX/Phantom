# Strumento di analisi: stampa nel log i sorgenti del server di scrcpy che ci interessano.
name: Analisi scrcpy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione di scrcpy (es. 5.0.1)"
        required: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sorgenti del server
        run: |
          git clone --quiet --filter=blob:none --branch "v${{ inputs.version }}" https://github.com/Genymobile/scrcpy src
          cd src
          S=server/src/main/java/com/genymobile/scrcpy
          echo "=== TREE ==="
          find server/src/main -name '*.java' | sed 's|server/src/main/java/com/genymobile/scrcpy/||' | sort | head -n 220
          for name in SurfaceEncoder ScreenCapture CleanUp; do
            f=$(find server -name "$name.java" | head -n 1)
            echo "=== FILE $f ==="
            cat "$f"
          done
          echo "=== FILE Server.java ==="
          cat "$(find server -name Server.java | head -n 1)"
          echo "=== LOG video ==="
          git log --oneline "v3.0..v${{ inputs.version }}" -- "$S/video" | head -n 120 || true
          echo "=== LOG parole chiave ==="
          git log --oneline -i -E --grep='low.latency|priority|max.fps|repeat|freeze|hang|deadlock|crash' "v3.0..v${{ inputs.version }}" -- server | head -n 80 || true
